<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 

    <link rel="stylesheet" href="styles.css">

    <title>10S_Padua_SW1: The Nickname Atlas</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-10">
                <h1 class="text-center">East Asia's Nickname Atlas</h1>
                <p class="text-center">Enter a country within East Asia to find out its unique nickname based on culture, geography, and history.</p>
            </div>
        </div>
    </div><br><br><br>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8">
                <h3 class="text-center">Search for the nickname of your chosen East Asian country!</h3><br>
                    <select id="country_name">
                        <option value="The Red Dragon">China</option>
                        <option value="The Land of the Rising Sun">Japan</option>
                        <option value="The Land of the Morning Calm">South Korea</option>
                        <option value="The Hermit Kingdom">North Korea</option>
                        <option value="The Formosa">Taiwan</option>
                        <option value="The Land of the Eternal Blue Sky">Mongolia</option>
                    </select><br><br>
                <input type="button" py-click="show_nickname" value="Show Nickname!"><br>
                <div id="result"></div><br><br>
            </div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
